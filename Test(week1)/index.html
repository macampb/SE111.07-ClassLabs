<!-- Telling our browser that this is an html file-->
<!DOCTYPE html>
<html>
    <head>
        <!-- Telling our broswer to use the default font/characters of computer-->
         <meta charset="UTF-8">
         <!-- Title of webpage-->
          <title> Week 1 Lab!</title>

    </head>

    <!--Everything will be rendered here -->
    <body>
        <h1> Hello Week 1 Class! </h1>

        <p> This is a test! </p>

        <p> This is another test </p>
        <!-- Unordered List -->
        <ul>

           <li> hello </li>
           <li> I like pie </li>
            <li> My favorite kind of pie is:</li>
            <li>Apple Pie </li>
        </ul>

        <!-- Ordered List -->

            <li> The Proud Family </li>
